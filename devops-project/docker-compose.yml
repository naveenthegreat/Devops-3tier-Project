services:

  postgres:
    image: postgres
    container_name: postgres-container
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devopsdb
    ports:
      - '5432:5432'


  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - '5000:5000'
    depends_on:
      - postgres

  
  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - '3000:3000'

    depends_on:
      - backend


